services:
  fc.codeflix.catalog.db:
      container_name: catalogdb-e2e
      hostname: catalogdb-e2e
      image: mysql
      ports:
        - 33060:3306
      environment:
       MYSQL_ROOT_PASSWORD: codeflix
       
  rabbitmq:
      container_name: adm_videos_rabbitmq_e2e
      image: rabbitmq:4-management
      hostname: rabbitmq-e2e
      environment:
        - RABBITMQ_DEFAULT_USER=adm-videos
        - RABBITMQ_DEFAULT_PASS=123456
      ports:
        -  25672:15672
        -  56720:5672