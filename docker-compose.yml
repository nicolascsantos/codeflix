services:
  fc.codeflix.catalog.db:
      container_name: catalogdb
      hostname: catalogdb
      image: mysql
      ports:
        - 3306:3306
      environment:
       MYSQL_ROOT_PASSWORD: codeflix

  rabbitmq:
    container_name: adm_videos_rabbitmq
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=adm-videos
      - RABBITMQ_DEFAULT_PASS=123456
    ports:
      -  15672:15672
      -  5672:5672

networks:
  default:
    name: service_catalog